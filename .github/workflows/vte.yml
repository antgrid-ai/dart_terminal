name: VTE

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "pkgs/vte/**"
      # test-flutter-android-integration builds the example app, which links
      # portable_pty's native assets — so a PTY-only change can break this
      # workflow. Without this, such a break stays invisible until someone
      # later touches pkgs/vte for an unrelated reason.
      - "pkgs/pty/**"
      - "pubspec.yaml"
      - "tool/apply_ghostty_vte_source_patches.sh"
      - "tool/verify_vte_android_libc.sh"
      - ".github/workflows/vte.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "pkgs/vte/**"
      - "pkgs/pty/**"
      - "pubspec.yaml"
      - "tool/apply_ghostty_vte_source_patches.sh"
      - "tool/verify_vte_android_libc.sh"
      - ".github/workflows/vte.yml"

jobs:
  build-vte-artifacts:
    name: "build-vte-${{ matrix.os_label }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux-gnu
            artifact: libghostty-vt.so
            os_label: linux-x64
          - runner: ubuntu-latest
            target: aarch64-linux-gnu
            artifact: libghostty-vt.so
            os_label: linux-arm64
          - runner: ubuntu-latest
            target: aarch64-macos
            artifact: libghostty-vt.dylib
            os_label: macos-arm64
          - runner: ubuntu-latest
            target: x86_64-macos
            artifact: libghostty-vt.dylib
            os_label: macos-x64
          - runner: ubuntu-latest
            target: x86_64-windows-gnu
            artifact: ghostty-vt.dll
            os_label: windows-x64
          - runner: ubuntu-latest
            target: aarch64-windows-gnu
            artifact: ghostty-vt.dll
            os_label: windows-arm64
          - runner: ubuntu-latest
            target: aarch64-linux-android
            artifact: libghostty-vt.so
            os_label: android-arm64
          - runner: ubuntu-latest
            target: arm-linux-androideabi
            artifact: libghostty-vt.so
            os_label: android-arm
          - runner: ubuntu-latest
            target: x86_64-linux-android
            artifact: libghostty-vt.so
            os_label: android-x64
          - runner: macos-latest
            target: aarch64-ios
            artifact: libghostty-vt.dylib
            os_label: ios-arm64
          - runner: macos-latest
            target: aarch64-ios-simulator
            artifact: libghostty-vt.dylib
            os_label: ios-sim-arm64
          - runner: macos-latest
            target: x86_64-ios-simulator
            artifact: libghostty-vt.dylib
            os_label: ios-sim-x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install Android NDK
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install binary inspection tools
        if: contains(matrix.target, 'android')
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Apply bundled Ghostty source patches
        run: ./tool/apply_ghostty_vte_source_patches.sh

      - name: Build libghostty-vt (${{ matrix.target }})
        working-directory: pkgs/vte/ghostty_vte/third_party/ghostty
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-prefix"
          zig build \
            -Demit-lib-vt=true \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseFast \
            -Dsimd=false \
            --prefix "$GITHUB_WORKSPACE/build-prefix" \
            --summary failures
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Locate built VTE artifact
        id: locate_vte
        run: |
          LIB=$(
            find "$GITHUB_WORKSPACE/build-prefix" \
              \( -type f -o -type l \) \
              \( -name '${{ matrix.artifact }}' -o -name '${{ matrix.artifact }}.*' \) \
              | sort \
              | head -1
          )
          if [ -z "$LIB" ]; then
            echo "::error::Could not find ${{ matrix.artifact }} in build-prefix"
            find "$GITHUB_WORKSPACE/build-prefix" -type f
            exit 1
          fi
          echo "path=$LIB" >> "$GITHUB_OUTPUT"

      - name: Verify Android libghostty-vt links libc
        if: contains(matrix.target, 'android')
        run: ./tool/verify_vte_android_libc.sh "${{ steps.locate_vte.outputs.path }}"

      - name: Package VTE artifact
        run: |
          ARTIFACT_DIR="$GITHUB_WORKSPACE/vte-${{ matrix.os_label }}-artifact"
          mkdir -p "$ARTIFACT_DIR"
          cp -L "${{ steps.locate_vte.outputs.path }}" \
            "$ARTIFACT_DIR/${{ matrix.artifact }}"
          file "${{ steps.locate_vte.outputs.path }}" \
            > "$ARTIFACT_DIR/file.txt"
          if [ "${{ contains(matrix.target, 'android') }}" = "true" ]; then
            readelf -d "${{ steps.locate_vte.outputs.path }}" \
              > "$ARTIFACT_DIR/readelf-dynamic.txt"
          fi

      - name: Upload VTE artifact
        uses: actions/upload-artifact@v4
        with:
          name: vte-${{ matrix.os_label }}-check
          path: ${{ github.workspace }}/vte-${{ matrix.os_label }}-artifact

  # ── Build native library + run Dart tests ──────────────────────────
  # NOTE: macOS is excluded because Zig-built dylibs lack Mach-O
  # header padding (-headerpad_max_install_names) and the Dart SDK's
  # install_name_tool rewrite fails.  Once Ghostty's build.zig adds
  # the flag, macOS can be re-enabled.
  #
  # This job relies on the build hook downloading a prebuilt binary from
  # a GitHub release.  Building from source with Zig exceeds free-tier
  # runner limits.  If the download fails (e.g. missing release), the
  # build hook falls back to source compilation which will time out.
  test-native:
    if: false  # Disabled: zig source build exceeds free-tier runner limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so a green run stays reproducible: the toolchain moving
          # under CI is a variable we do not want when a job flakes. Bump
          # deliberately rather than by drift.
          flutter-version: 3.47.1

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Verify Zig
        run: zig version

      - name: Install dependencies
        run: flutter pub get

      - name: Run ghostty_vte tests
        working-directory: pkgs/vte/ghostty_vte
        run: dart test -r expanded

  # ── Verify committed WASM module ─────────────────────────────────
  # The wasm binary is committed to the repo (built locally) because
  # compiling it from source via Zig exceeds free-tier CI runner limits.
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify WASM artifact exists
        run: |
          ls -lh pkgs/vte/ghostty_vte_flutter/assets/ghostty-vt.wasm
          file pkgs/vte/ghostty_vte_flutter/assets/ghostty-vt.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: vte-wasm-check
          path: pkgs/vte/ghostty_vte_flutter/assets/ghostty-vt.wasm

  # ── Flutter package tests ──────────────────────────────────────────
  test-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so a green run stays reproducible: the toolchain moving
          # under CI is a variable we do not want when a job flakes. Bump
          # deliberately rather than by drift.
          flutter-version: 3.47.1

      - name: Install dependencies
        run: flutter pub get

      - name: Run ghostty_vte_flutter tests
        run: flutter test pkgs/vte/ghostty_vte_flutter/test

  # ── Android integration tests ──────────────────────────────────────
  test-flutter-android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so a green run stays reproducible: the toolchain moving
          # under CI is a variable we do not want when a job flakes. Bump
          # deliberately rather than by drift.
          flutter-version: 3.47.1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Limit Flutter devices to Android
        run: flutter config --no-enable-linux-desktop --no-enable-web

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        working-directory: pkgs/vte/ghostty_vte_flutter/example
        run: flutter pub get

      - name: Run ghostty_vte_flutter Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            flutter devices
            adb devices -l
            adb shell wm size || true
            adb shell wm density || true
            cd pkgs/vte/ghostty_vte_flutter/example

            # flutter_tools connects to the app's VM service through DDS, and
            # when that connection is lost before a single test body runs the
            # file is reported as "failing to load" with
            #   getVersion: (112) Service has disappeared
            # DDS raises 112 only when it forwarded a request and the app's VM
            # service socket was already closed, so this signature means the
            # app process died on device -- not that the tool timed out.
            #
            # integration_test_device.dart only starts streaming device logs
            # AFTER that connection succeeds, so an app that dies inside this
            # window has its logcat discarded and the cause is unrecoverable.
            # Capture it ourselves, and use it to tell the two causes apart:
            # a real crash on device fails the job immediately, while a lost
            # handshake with a clean log is retried once.
            #
            # Output is buffered to a file rather than piped through tee so
            # the exit status is the test runner's, not tee's, without
            # depending on bash-only PIPESTATUS/pipefail.
            run_suite() {
              adb logcat -c || true
              if flutter test integration_test/touch_terminal_e2e_test.dart > test-output.log 2>&1; then
                cat test-output.log
                return 0
              fi
              cat test-output.log
              return 1
            }

            attempt=1
            max_attempts=2
            while true; do
              if run_suite; then
                exit 0
              fi

              adb logcat -d -v threadtime > logcat.txt 2>/dev/null || true
              echo "::group::logcat (attempt $attempt/$max_attempts)"
              tail -n 500 logcat.txt || true
              echo "::endgroup::"

              # An empty log means adb could not talk to the device at all, so
              # the closed socket was the emulator connection going away rather
              # than the app dying behind it. Worth saying out loud, because the
              # two look identical from the tool's side.
              if [ ! -s logcat.txt ]; then
                echo "Device log is empty -- adb lost the emulator, so this is an emulator-connection drop, not an app crash."
                adb devices -l || true
              fi

              # Anything here is the device telling us why the app went away.
              # Every pattern is anchored to our own package or our own native
              # libraries: an emulator kills background processes (Chrome
              # sandbox helpers and the like) constantly, and matching those
              # would fail the job for somebody else's death. Note that a
              # native crash spans several lines -- the kernel comm field is
              # truncated to 15 chars ("m.example.example"), the package name
              # only appears in the tombstone header -- so these match the
              # whole file rather than requiring one line to carry everything.
              app_pkg=com.example.example
              crash_re='>>> com\.example\.example <<<'                 # native tombstone header
              crash_re="$crash_re"'|Process: com\.example\.example'    # Java FATAL EXCEPTION
              crash_re="$crash_re"'|Killing [0-9]+:com\.example\.example'
              crash_re="$crash_re"'|lowmemorykiller.*example\.example'
              crash_re="$crash_re"'|Fatal signal.*example\.example'
              crash_re="$crash_re"'|#[0-9]+ pc .*(libghostty|libportable_pty)'
              if grep -qE "$crash_re" logcat.txt; then
                echo "Device log shows $app_pkg crashed or was killed -- this is not a lost handshake."
                grep -nE "$crash_re" logcat.txt | head -n 40
                exit 1
              fi

              # A real test failure must not be retried away.
              if ! grep -q "Service has disappeared\|Service connection disposed" test-output.log; then
                echo "Tests failed on their own merits; not retrying."
                exit 1
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Lost the VM service handshake $attempt times in a row."
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "Lost the VM service handshake with a clean device log; retrying ($attempt/$max_attempts)."
            done

        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
