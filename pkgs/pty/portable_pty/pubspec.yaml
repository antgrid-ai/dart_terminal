name: portable_pty
description: >-
  Cross-platform pseudo-terminal (PTY) for Dart.
  Spawns shell subprocesses on Linux, macOS, Windows, and Android, links native
  assets into supported iOS builds, and connects through WebSocket or
  WebTransport to a remote PTY server on web.
# Build metadata, not a version bump: the Dart API is upstream's 0.0.6, but the
# Android native libraries are rebuilt 16 KB-aligned, so the shipped bytes are
# not upstream's. Build metadata is ignored for constraint solving, so `^0.0.6`
# consumers are unaffected — which is why this cannot be `-antgrid.1`, a semver
# pre-release that `^0.0.6` would refuse. The release tag carries the same
# suffix; see native_prebuilt.yaml for why it must not use a dash either.
version: 0.0.6+antgrid.2

repository: https://github.com/bharathm03/dart_terminal/tree/master/pkgs/pty/portable_pty
homepage: https://github.com/bharathm03/dart_terminal
issue_tracker: https://github.com/bharathm03/dart_terminal/issues

topics:
  - terminal
  - pty
  - ffi
  - shell
  - process

environment:
  sdk: ^3.10.4

executables:
  setup: setup

resolution: workspace

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.2.0
  hooks: ^2.1.0
  native_prebuilt: ^0.3.2
  web: ^1.1.1

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.25.8
