# Regenerates lib/ghostty_vte_bindings_generated.dart from the vendored ghostty
# headers. Re-run this whenever third_party/ghostty is bumped:
#
#     dart run ffigen --config ffigen.yaml
#
# Skipping it is silent and severe. The C API passes option structs BY VALUE, so
# a field added upstream leaves Dart allocating a short struct and the callee
# reading the missing tail from uninitialised heap. That is how 0.1.4 shipped a
# formatter that segfaulted on every call.
name: GhosttyVtBindings
description: Bindings for the ghostty-vt C API.
output: 'lib/ghostty_vte_bindings_generated.dart'
headers:
  entry-points:
    - 'third_party/ghostty/include/ghostty/vt.h'
  include-directives:
    - '**/ghostty/**'
compiler-opts:
  - '-Ithird_party/ghostty/include'
ffi-native:
  assetId: 'package:ghostty_vte/ghostty_vte_bindings_generated.dart'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: unused_field
